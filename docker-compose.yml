services:
  db:
    image: postgres:16-alpine
    container_name: mini-network-db
    environment:
      POSTGRES_DB: professional_network
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d professional_network"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: mini-network-backend
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+psycopg://app_user:app_password@db:5432/professional_network
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: mini-network-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
